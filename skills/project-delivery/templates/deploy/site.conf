# Render placeholders before uploading. One file per project and hostname.
server {
    listen 0.0.0.0:__PUBLIC_PORT__;
    server_name __SERVER_NAME__;
    # Domain mode: replace with `if ($host != "example.com") { return 444; }`.
    # IP mode: use the public IP as server_name and replace the guard with an empty line.
    __HOST_GUARD__

    add_header X-CES-Release "__RELEASE_ID__" always;
    location / {
        proxy_pass http://127.0.0.1:__UPSTREAM_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_hide_header X-CES-Release;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ces_connection_upgrade;
        proxy_read_timeout 60s;
    }
}
